services:
  mysql-node1:
    image: mysql:8.4
    container_name: mysql-node1
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copia .env.example como .env y define una contrasena}
      MYSQL_DATABASE: data_bugs
    volumes:
      - mysql_node1_data:/var/lib/mysql
      - ./conf/my.cnf:/etc/mysql/conf.d/node1.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_node1_data:
