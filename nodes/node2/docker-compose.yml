services:
  mysql-node2:
    image: mysql:8.4
    container_name: mysql-node2
    restart: always
    network_mode: host
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data:/var/lib/mysql
      - ./conf/my.cnf:/etc/mysql/conf.d/my.cnf