services:
  mysql-node2:
    image: mysql:8.4
    container_name: mysql-node2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
    ports:
      - "3306:3306"
      - "33061:33061"
    volumes:
      - ./data:/var/lib/mysql
      - ./conf/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - red-proyecto

networks:
  red-proyecto:
    driver: bridge
